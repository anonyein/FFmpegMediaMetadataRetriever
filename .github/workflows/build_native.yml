name: build_native

concurrency:
  group: build_${{ github.ref }}
  cancel-in-progress: true
  
on:
  workflow_dispatch:

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: corretto
        java-version: 17
        
    - name: Setup Android NDK
      id: setup-ndk
      uses: nttld/setup-ndk@v1
      with:
        ndk-version: r28c
        local-cache: false
    
    - name: Create local.properties
      run: |
        echo "sdk.dir=$ANDROID_HOME" >> local.properties
        echo "ndk.dir=$ANDROID_HOME/ndk/$(ls $ANDROID_HOME/ndk | sort -V | tail -1)" >> local.properties
        # echo "ndk_build.dir=/usr/local/lib/android/sdk/ndk/21.0.0" >> local.properties
        cat local.properties

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew
    - name: Build with Gradle
      run: |
        ./gradlew :native:build
        ./gradlew :native:properties | grep buildDir
    - name: Upload the Artifact
      uses: actions/upload-artifact@v4
      with:
        name: build-native-lib
        path: native/build
